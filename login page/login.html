<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Engine Talk</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <header>
    <h1>ENGINE <span>TALK</span></h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../browse cars/browsecars.html">Browse Cars</a>
      <a href="../garage/index.html">Garage</a>
      <a href="../about us/aboutus.html">About</a>
      <a href="../addtocart page/addtocart.html" class="cart-link">🛒 Cart</a>
      <a href="../payment/payment.html" class="prebook-btn">⚡ Pre-Book</a>
      <a href="../login page/login.html" id="loginLink">Login</a>
      <span id="userArea"></span>
    </nav>
  </header>

  <section class="login-section">
    <div class="login-box">

      <!-- Decorative top accent line -->
      <div class="box-accent"></div>

      <h2 id="formTitle">Welcome Back</h2>
      <p class="login-sub" id="loginSub">Sign in to your account</p>

      <!-- Name field (Sign Up only) -->
      <input type="text" id="name" placeholder="Full Name" style="display:none;">

      <input type="email" id="email" placeholder="Email Address">
      <input type="password" id="password" placeholder="Password">

      <button onclick="submitForm()" id="mainBtn">Login</button>

      <p id="message"></p>

      <p class="toggle-line">
        <span id="toggleText">Don't have an account?</span>
        <a href="#" onclick="toggleForm(); return false;" id="toggleLink">Sign Up</a>
      </p>

    </div>
  </section>

  <script src="login.js"></script>
</body>
</html>
