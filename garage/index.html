<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garage — Engine Talk</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="garage.css">
</head>
<body class="page-body">

  <header>
    <h1>ENGINE <span>TALK</span></h1>
    <nav>
      <a href="../home page/home.html">Home</a>
      <a href="../browse cars/browsecars.html">Browse Cars</a>
      <a href="../garage/index.html" class="active">Garage</a>
      <a href="../about us/aboutus.html">About</a>
      <a href="../contact/contact.html">Contact</a>
      <a href="../addtocart page/addtocart.html" class="cart-link">🛒 Cart</a>
      <a href="../contact/contact.html" class="contact-btn">📞 Contact Us</a>
      <a href="../login page/login.html">Login</a>
    </nav>
  </header>

  <section class="garage-section">
    <h2 class="garage-title">MY GARAGE</h2>

    <div class="garage-main">
      <!-- LEFT: Car Image -->
      <div class="garage-left">
        <div class="car-display">
          <img id="mainCarImg" src="images/cars/ferrari/red.png" alt="Selected Car">
        </div>
        <div class="color-picker">
          <p>SELECT COLOR</p>
          <div class="color-btns">
            <button class="color-btn active" data-color="red" onclick="changeColor(this)" style="background:#e02020;">Red</button>
            <button class="color-btn" data-color="blue" onclick="changeColor(this)" style="background:#1a6eff;">Blue</button>
            <button class="color-btn" data-color="black" onclick="changeColor(this)" style="background:#111; border:2px solid #555;">Black</button>
          </div>
        </div>
      </div>

      <!-- RIGHT: Car Details -->
      <div class="garage-right">
        <div class="car-badge" id="carBadge">FEATURED</div>
        <h2 class="car-name" id="carName">Ferrari F8</h2>
        <p class="car-price" id="carPrice">$300,000</p>
        <div class="car-specs">
          <div class="spec"><span class="spec-label">ENGINE</span><span class="spec-value" id="specEngine">3.9L V8 Turbo</span></div>
          <div class="spec"><span class="spec-label">0–60 MPH</span><span class="spec-value" id="specSpeed">2.9s</span></div>
          <div class="spec"><span class="spec-label">TOP SPEED</span><span class="spec-value" id="specTop">211 mph</span></div>
          <div class="spec"><span class="spec-label">HORSEPOWER</span><span class="spec-value" id="specHP">710 HP</span></div>
          <div class="spec"><span class="spec-label">YEAR</span><span class="spec-value" id="specYear">2023</span></div>
          <div class="spec"><span class="spec-label">FUEL</span><span class="spec-value" id="specFuel">Petrol</span></div>
        </div>
        <button class="add-cart-btn" onclick="addToCart()">Add to Cart</button>
      </div>
    </div>

    <!-- BOTTOM: Car Switcher -->
    <div class="car-switcher">
      <p class="switcher-label">SWITCH CAR</p>
      <div class="car-thumbs">
        <div class="thumb active" data-folder="ferrari" data-name="Ferrari F8" data-price="$300,000" data-engine="3.9L V8 Turbo" data-speed="2.9s" data-top="211 mph" data-hp="710 HP" data-year="2023" data-fuel="Petrol" data-badge="FEATURED" onclick="switchCar(this)">
          <img src="images/cars/ferrari/red.png" alt="Ferrari F8"><p>Ferrari F8</p>
        </div>
        <div class="thumb" data-folder="lamborghini" data-name="Lamborghini Huracán" data-price="$230,000" data-engine="5.2L V10" data-speed="2.5s" data-top="202 mph" data-hp="630 HP" data-year="2023" data-fuel="Petrol" data-badge="BESTSELLER" onclick="switchCar(this)">
          <img src="images/cars/lamborghini/blue.png" alt="Lamborghini Huracan"><p>Lamborghini Huracán</p>
        </div>
        <div class="thumb" data-folder="bmw" data-name="BMW M4" data-price="$85,000" data-engine="3.0L I6 Turbo" data-speed="3.8s" data-top="180 mph" data-hp="503 HP" data-year="2023" data-fuel="Petrol" data-badge="POPULAR" onclick="switchCar(this)">
          <img src="images/cars/bmw/red.png" alt="BMW M4"><p>BMW M4</p>
        </div>
        <div class="thumb" data-folder="porsche" data-name="Porsche 911" data-price="$150,000" data-engine="3.0L H6 Twin Turbo" data-speed="3.2s" data-top="193 mph" data-hp="473 HP" data-year="2023" data-fuel="Petrol" data-badge="ICONIC" onclick="switchCar(this)">
          <img src="images/cars/porsche/black.png" alt="Porsche 911"><p>Porsche 911</p>
        </div>
      </div>
    </div>
  </section>

  <script src="garage.js"></script>
</body>
</html>
