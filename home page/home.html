<!DOCTYPE html>
<html lang="en">

<head>

  <title>Engine Talk</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
<header>
<h1>ENGINE TALK</h1>
<nav>
<a href="#">Home</a>
<a href="#">Browse Cars</a>
<a href="#">About</a>
<a href="login.html" id="loginBtn">Login</a>
<span id="welcomeUser"></span>
<button onclick="logout()" id="logoutBtn" style="display:none;">Logout</button>
</nav>
</header>


<section class="mySection">
<div class="mySectiontext">
  <h2>Find Your Dream Car</h2>
  <p>Buy. Sell. Rev It Up</p>
  <button onclick="browse()">Browse Cars</button>
</div>
</section>

<section class="cars">
<h2>Browse Cars</h2>
<div class="car-container">
<div class="car">
<img src="home images/image2.png" alt="BMW M3" >
<h3>BMW M3</h3>
<p>$45,000</p>
<button>View Details</button>
</div>
<div class="car">
  <img src="home images/image3.png" alt="Audi R8">
  <h3>Audi R8</h3>
  <p>$120,000</p>
  <button>View Details</button>

</div>
<div class="car">
<img src="home images/image4.png" alt="lamborghini" >
<h3>Lamborghini Huracan</h3>
<p>$230,000</p>
<button>View Details</button>
</div>
</div>
</section>
<script src="home.js"></script>
<script>
  const user = localStorage.getItem("userName");

  if (user) {
    document.getElementById("welcomeUser").innerText = "Welcome, " + user;
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("logoutBtn").style.display = "inline";
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }
</script>
</body>
</html>
